version: "3.8"

services:
  bot:
    build: .
    container_name: botinok-temcshika
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_DB_PATH: /data/bot.db
    volumes:
      # Bind-mount a host directory so bot.db lives on the host (easy backup).
      # Container runs as root, so the file is created/owned without uid issues.
      - ./data:/data
